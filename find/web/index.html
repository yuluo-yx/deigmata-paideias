<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>子域名树状展示</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>子域名树状展示</h1>
        <p>从根域名向下搜索子域名，节点包含域名、IP 与地理位置。</p>
      </header>

      <section class="controls">
        <label>
          根域名
          <input id="domainInput" type="text" placeholder="example.com" />
        </label>
        <label>
          深度
          <input id="depthInput" type="number" min="0" max="5" value="2" />
        </label>
        <label>
          并发
          <input id="workersInput" type="number" min="1" max="100" value="20" />
        </label>
        <button id="startBtn">开始扫描</button>
        <span id="status" class="status">待命</span>
      </section>

      <section class="tree">
        <div id="treeContainer" class="tree-container"></div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
